name: CALIBRE
options:
  bundleIdPrefix: com.aarivbhalla
  deploymentTarget:
    iOS: "17.0"
targets:
  CALIBRE:
    type: application
    platform: iOS
    sources:
      - path: CALIBRE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarivbhalla.calibre
        DEVELOPMENT_TEAM: NSKUC2DWJT
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "CALIBRE uses the camera to watch the simulator's video screen and evaluate the bleeding response."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_CFBundleDisplayName: CALIBRE
        TARGETED_DEVICE_FAMILY: "1"
