name: BleedWatch
options:
  bundleIdPrefix: com.aarivbhalla
  deploymentTarget:
    iOS: "17.0"
targets:
  BleedWatch:
    type: application
    platform: iOS
    sources:
      - path: BleedWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aarivbhalla.bleedwatch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "BleedWatch uses the camera to watch a surgical video screen and estimate bleeding."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
